name: CI
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  classify:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Classify tested merge content
        id: classify
        env:
          PR_BASE_REF: ${{ github.base_ref }}
          PR_HEAD_REF: ${{ github.head_ref }}
        run: node scripts/ci/classify.mjs
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - name: Check documentation
        run: |-
          node --test scripts/conventions/*.test.mjs scripts/promotion/*.test.mjs
          pnpm run docs:test
          pnpm run docs:check
          node --test scripts/coverage/report.test.mjs scripts/coverage/baseline.test.mjs scripts/coverage/comment.test.mjs

          node --test scripts/ci/*.test.mjs
      - name: Verify release generation and recovery offline
        run: pnpm run release:test
      - name: Type check
        run: pnpm run typecheck
        if: needs.classify.outputs.mode == 'full'
      - name: Run ESLint
        run: pnpm run lint
        if: needs.classify.outputs.mode == 'full'
    needs:
      - classify
  test:
    name: Unit Tests
    outputs:
      artifact-id: ${{ steps.coverage.outputs.artifact-id }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - name: Verify resumable legacy image indexing
        run: node --test scripts/backfill-post-media.test.mjs
      - name: Run tests with coverage
        run: pnpm run test:coverage
      - name: Upload coverage report
        id: coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
          overwrite: true
    needs:
      - classify
    if: needs.classify.outputs.mode == 'full'
  build:
    name: Build
    runs-on: ubuntu-latest
    needs:
      - classify
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: placeholder-service-key
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - name: Build
        run: pnpm run build
    if: needs.classify.outputs.mode == 'full'
  e2e:
    name: Full-stack API and publication
    needs:
      - classify
    if: needs.classify.outputs.mode == 'full'
    outputs:
      artifact-id: ${{ steps.e2e-reports.outputs.artifact-id }}
    env:
      E2E_COVERAGE: 1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium
      - uses: ./.github/actions/setup-supabase
      - name: Generate disposable provider encryption key
        run: |
          node --input-type=module -e 'import { appendFileSync } from "node:fs"; import { randomBytes } from "node:crypto"; appendFileSync(process.env.GITHUB_ENV, "LLM_KEY_ENCRYPTION_SECRET=" + randomBytes(16).toString("hex") + "\n")'
      - name: Run API and browser tests
        run: pnpm run test:e2e
      - name: Verify signup onboarding on desktop and mobile
        run: pnpm exec playwright test --config=e2e/onboarding.config.ts
      - name: Verify publication of URLs created after a production build
        run: |
          pnpm run build
          E2E_PRODUCTION=1 pnpm exec playwright test e2e/browser/publication-pages.spec.ts --project=browser
      - name: Upload reports and failure artifacts
        id: e2e-reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-reports-fullstack
          path: |-
            test-results/
            playwright-report/
            coverage/e2e/
          retention-days: 7
          overwrite: true
      - name: Stop disposable Supabase
        if: always()
        run: pnpm dlx supabase@2.119.0 stop --no-backup
  coverage:
    name: Coverage report
    if: ${{ !cancelled() }}
    needs:
      - classify
      - test
      - e2e
      - browsers
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Download unit coverage
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: coverage-report
          path: artifacts/unit
        if: needs.classify.outputs.mode == 'full'
      - name: Download E2E reports
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          path: artifacts/e2e
          pattern: e2e-reports-*
          merge-multiple: true
        if: needs.classify.outputs.mode == 'full'
      - name: Aggregate split E2E artifacts
        id: aggregate
        if: needs.classify.outputs.mode == 'full'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-reports
          path: artifacts/e2e/
          retention-days: 7
          overwrite: true
          if-no-files-found: error
      - name: Determine tested base commit
        id: comparison
        env:
          EVENT_NAME: ${{ github.event_name }}
          PREVIOUS_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            comparison_sha="$(git rev-parse HEAD^1)"
          else
            comparison_sha="$PREVIOUS_SHA"
          fi
          printf 'sha=%s\n' "$comparison_sha" >> "$GITHUB_OUTPUT"
      - name: Find exact base-commit baseline
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_SHA: ${{ steps.comparison.outputs.sha }}
        run: node scripts/coverage/baseline.mjs
        if: needs.classify.outputs.mode == 'full'
      - name: Publish coverage summary
        if: always()
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASELINE_SHA: ${{ steps.comparison.outputs.sha }}
          UNIT_STATUS: ${{ needs.test.result }}
          UNIT_ARTIFACT_ID: ${{ needs.test.outputs.artifact-id }}
          E2E_ARTIFACT_ID: ${{ steps.aggregate.outputs.artifact-id }}
          VALIDATION_MODE: ${{ needs.classify.outputs.mode }}
        run: node scripts/coverage/report.mjs
      - name: Save coverage baseline and summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-baseline
          path: coverage-report/
          retention-days: 7
          overwrite: true
      - name: Verify split artifact inventory
        if: ${{ always() && needs.classify.outputs.mode == 'full' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, { ...context.repo, run_id: context.runId, per_page: 100 });
            const names = new Set(artifacts.filter(artifact => !artifact.expired).map(artifact => artifact.name));
            const expected = ['e2e-reports-fullstack', 'e2e-reports-isolated-harness', 'e2e-reports-isolated-auth', 'e2e-reports-isolated-content'];
            const missing = expected.filter(name => !names.has(name));
            if (missing.length) throw new Error('Missing split report artifacts: ' + missing.join(', '));
  database:
    name: Database integration and security
    needs:
      - classify
    if: needs.classify.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - uses: ./.github/actions/setup-supabase
      - name: Verify shared authentication budgets
        run: |
          docker exec -i supabase_db_nextjs-blog-cms psql -U postgres -d postgres -v ON_ERROR_STOP=1 < database/tests/auth_abuse.sql
          docker exec -i supabase_db_nextjs-blog-cms psql -U postgres -d postgres -v ON_ERROR_STOP=1 < database/tests/auth_abuse_review.sql
          node database/tests/auth-abuse-concurrency.mjs
      - name: Verify legacy AI retirement and credential ownership
        run: |
          node database/tests/legacy-ai-upgrade.mjs
          docker exec -i supabase_db_nextjs-blog-cms psql -U postgres -d postgres -v ON_ERROR_STOP=1 < database/tests/legacy_ai_retirement.sql
          docker exec -i supabase_db_nextjs-blog-cms psql -U postgres -d postgres -v ON_ERROR_STOP=1 < database/tests/bulk_post_retention.sql
      - name: Verify MFA database and storage boundaries
        run: docker exec -i supabase_db_nextjs-blog-cms psql -U postgres -d postgres -v ON_ERROR_STOP=1 < database/tests/mfa_assurance.sql
      - name: Verify private onboarding progress and completion
        run: docker exec -i supabase_db_nextjs-blog-cms psql -U postgres -d postgres -v ON_ERROR_STOP=1 < database/tests/onboarding.sql
      - name: Verify author profile database privacy
        run: docker exec -i supabase_db_nextjs-blog-cms psql -U postgres -d postgres -v ON_ERROR_STOP=1 < database/tests/public_author_profiles.sql
      - name: Verify private draft recovery permissions
        run: docker exec -i supabase_db_nextjs-blog-cms psql -U postgres -d postgres -v ON_ERROR_STOP=1 < database/tests/post_working_copies.sql
      - name: Verify URL reservation constraints and privacy
        run: docker exec -i supabase_db_nextjs-blog-cms psql -U postgres -d postgres -v ON_ERROR_STOP=1 < database/tests/post_slug_routes.sql
      - name: Verify post summaries, pagination and dashboard permissions
        run: docker exec -i supabase_db_nextjs-blog-cms psql -U postgres -d postgres -v ON_ERROR_STOP=1 < database/tests/post_lists.sql
      - name: Verify atomic post rollback and retry contracts
        run: docker exec -i supabase_db_nextjs-blog-cms psql -U postgres -d postgres -v ON_ERROR_STOP=1 < database/tests/atomic_posts.sql
      - name: Verify taxonomy merges and aliases
        run: docker exec -i supabase_db_nextjs-blog-cms psql -U postgres -d postgres -v ON_ERROR_STOP=1 < database/tests/tag_taxonomy.sql
      - name: Verify image retention and cleanup permissions
        run: |
          docker exec -i supabase_db_nextjs-blog-cms psql -U postgres -d postgres -v ON_ERROR_STOP=1 < database/tests/post_media.sql
          docker exec -i supabase_db_nextjs-blog-cms psql -U postgres -d postgres -v ON_ERROR_STOP=1 < database/tests/post_media_dedup.sql
          node database/tests/post-media-concurrency.mjs
          docker exec -i supabase_db_nextjs-blog-cms psql -U postgres -d postgres -v ON_ERROR_STOP=1 < database/tests/media_library.sql
          node database/tests/media-library-concurrency.mjs
          node database/tests/media-library-upgrade.mjs
      - name: Verify comment write protection and concurrency
        run: |
          docker exec -i supabase_db_nextjs-blog-cms psql -U postgres -d postgres -v ON_ERROR_STOP=1 < database/tests/comment_writes.sql
          node database/tests/comment-writes-concurrency.mjs
      - name: Verify comment reaction eligibility, privacy and concurrency
        run: |
          docker exec -i supabase_db_nextjs-blog-cms psql -U postgres -d postgres -v ON_ERROR_STOP=1 < database/tests/comment_reactions.sql
          node database/tests/comment-reactions-concurrency.mjs
      - name: Verify article reaction eligibility, privacy and concurrency
        run: |
          docker exec -i supabase_db_nextjs-blog-cms psql -U postgres -d postgres -v ON_ERROR_STOP=1 < database/tests/article_reactions.sql
          node database/tests/article-reactions-concurrency.mjs
      - name: Verify newsletter queue retry and cancellation contracts
        run: docker exec -i supabase_db_nextjs-blog-cms psql -U postgres -d postgres -v ON_ERROR_STOP=1 < database/tests/newsletter_queue.sql
      - name: Stop disposable Supabase
        if: always()
        run: pnpm dlx supabase@2.119.0 stop --no-backup
  browsers:
    name: Isolated browsers (${{ matrix.group }})
    needs:
      - classify
    if: needs.classify.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      E2E_COVERAGE: 1
    strategy:
      fail-fast: false
      matrix:
        group:
          - harness
          - auth
          - content
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify coverage collection and failure reporting
        run: node --test scripts/coverage/collection.test.mjs
        if: matrix.group == 'harness'
      - name: Run all isolated suites in this group
        run: node scripts/ci/browser.mjs "${{ matrix.group }}"
      - name: Upload reports and failure artifacts
        id: e2e-reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-reports-isolated-${{ matrix.group }}
          path: |-
            test-results/
            playwright-report/
            coverage/e2e/
          retention-days: 7
          overwrite: true
  gate:
    name: CI gate
    if: ${{ always() }}
    needs:
      - classify
      - lint
      - test
      - build
      - database
      - e2e
      - browsers
      - coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Require every applicable validation
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci/gate.mjs
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
