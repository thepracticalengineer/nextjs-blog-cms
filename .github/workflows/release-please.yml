name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

# Repository token only checks out trusted main; App credentials are scoped to the final step.
permissions:
  contents: read

concurrency:
  group: release-please-main
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      # Trusted main only; no App credentials during dependency installation.
      - name: Install pinned release library
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check release App configuration
        env:
          APP_CLIENT_ID: ${{ vars.RELEASE_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_CLIENT_ID" ] || [ -z "$APP_PRIVATE_KEY" ]; then
            echo '::error::Set RELEASE_APP_CLIENT_ID and RELEASE_APP_PRIVATE_KEY. See docs/operations/releases.md#initial-setup.'
            exit 1
          fi

      - name: Create repository-scoped release token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Update release PR or publish merged release
        run: node scripts/release/run.mjs
        env:
          RELEASE_TOKEN: ${{ steps.app-token.outputs.token }}
