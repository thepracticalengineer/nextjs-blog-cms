version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      next:
        patterns: [next, '@next/*', eslint-config-next]
      react:
        patterns: [react, react-dom, '@types/react', '@types/react-dom']
      tiptap:
        patterns: ['@tiptap/*']
      test-tooling:
        patterns: [vitest, '@vitest/*', vite, '@vitejs/*', jsdom, '@testing-library/*']
      supabase:
        patterns: ['@supabase/*']
    ignore:
      # See the compatibility follow-up linked in docs/dependency-upgrade.md.
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
