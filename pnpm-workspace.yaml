# Fail installation on incompatible required peers; keep pnpm's isolated layout.
strictPeerDependencies: true

# Reviewed native resolver bootstrap used by ESLint's import resolver.
onlyBuiltDependencies:
  - unrs-resolver

# These published packages need no runtime files generated by install hooks.
ignoredBuiltDependencies:
  - msw # Copies a browser worker only when msw.workerDirectory is configured.
  - '@google/genai' # Published builds require no bootstrap.
  - protobufjs # Only emits dependency version-scheme warnings.
