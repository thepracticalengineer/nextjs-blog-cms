<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Reset your password</title></head>
<body style="font-family:Arial,sans-serif;background:#f8fafc;color:#0f172a;padding:32px 16px;">
  <main style="max-width:480px;margin:auto;background:white;padding:32px;border-radius:16px;">
    <p style="color:#2563eb;font-weight:bold;">The Practical Engineer</p>
    <h1>Reset your password</h1>
    <p>Follow this link to choose a new password. This link can only be used once.</p>
    <p><a href="{{ .RedirectTo }}&amp;token_hash={{ .TokenHash }}&amp;type=recovery" style="color:#2563eb;">Reset my password</a></p>
    <p>If you didn’t request a password reset, you can ignore this email.</p>
  </main>
</body>
</html>
